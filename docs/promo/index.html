<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D97757">
  <meta name="description" content="南昌市第十五中学纪念页宣传片：35 秒公开在线播放。">
  <link rel="canonical" href="https://xxc2007.github.io/In-memory-of-Nanchang-No.-15-Middle-School/promo/">
  <title>宣传片｜青山湖畔的纪念册</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f0eee6;
      --ink: #1f1e1d;
      --muted: #6e6a63;
      --line: rgba(31, 30, 29, .16);
      --terracotta: #d97757;
      --terracotta-dark: #a95138;
      --panel: rgba(255, 255, 255, .58);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      background-image: linear-gradient(rgba(31, 30, 29, .025) 1px, transparent 1px);
      background-size: 100% 7px;
    }

    a { color: inherit; }

    .page {
      width: min(100% - 40px, 1120px);
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-weight: 650;
      letter-spacing: 0;
      text-decoration: none;
      text-transform: none;
    }

    .back:hover, .back:focus-visible { color: var(--terracotta-dark); }

    .hero {
      max-width: 760px;
      padding: clamp(58px, 10vw, 116px) 0 54px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--terracotta-dark);
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .15em;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.8rem, 8vw, 6.7rem);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: .98;
    }

    h1 em {
      color: var(--terracotta-dark);
      font-style: normal;
    }

    .lede {
      max-width: 640px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 1.8vw, 1.25rem);
      line-height: 1.75;
    }

    .player-shell {
      padding: clamp(16px, 3vw, 28px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(31, 30, 29, .08);
    }

    .player-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 16px;
    }

    .player-heading h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 500;
    }

    .duration {
      color: var(--muted);
      font-size: .86rem;
      white-space: nowrap;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 13px;
      background: #171615;
      box-shadow: 0 8px 24px rgba(31, 30, 29, .14);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding-top: 18px;
    }

    button, .file-link {
      min-height: 44px;
      border-radius: 999px;
      font: inherit;
      font-size: .94rem;
      font-weight: 700;
      text-decoration: none;
    }

    button {
      padding: 0 20px;
      border: 1px solid var(--terracotta);
      color: #fff;
      background: var(--terracotta);
      cursor: pointer;
    }

    button:hover, button:focus-visible { background: var(--terracotta-dark); }

    .file-link {
      display: inline-flex;
      align-items: center;
      padding: 0 18px;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .file-link:hover, .file-link:focus-visible { border-color: var(--terracotta); }

    button:focus-visible, a:focus-visible {
      outline: 3px solid rgba(217, 119, 87, .38);
      outline-offset: 3px;
    }

    .note {
      margin: 18px 2px 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.65;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px 24px;
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .82rem;
    }

    footer a { color: var(--terracotta-dark); }

    @media (max-width: 600px) {
      .page { width: min(100% - 24px, 1120px); padding-top: 18px; }
      .topline { align-items: flex-start; flex-direction: column; gap: 10px; }
      .hero { padding: 58px 0 38px; }
      .player-heading { align-items: flex-start; flex-direction: column; gap: 6px; }
      .player-shell { border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline">
      <a class="back" href="../" aria-label="返回纪念册首页">← 返回纪念册</a>
      <span>VIDEO / 35 SEC</span>
    </div>

    <header class="hero">
      <p class="eyebrow">南昌市第十五中学 · 公开在线播放</p>
      <h1>把纪念册拍成一段<br><em>可以回去的时间</em></h1>
      <p class="lede">从校徽与首屏出发，经过沿革、校园摄影、水塔昼夜、八机位地图和隐私安全的留言墙演示，最后回到整本纪念册。点击下方播放键即可观看，无需登录。</p>
    </header>

    <section class="player-shell" id="player" aria-labelledby="player-title">
      <div class="player-heading">
        <h2 id="player-title">青山湖畔的纪念册 · 宣传片</h2>
        <span class="duration">35 秒 · 1080p · MP4</span>
      </div>

      <video id="promo-video" controls playsinline preload="metadata" poster="../screenshot-hero.png">
        <source src="./nanchang15-promo.mp4" type="video/mp4">
        您的浏览器不支持内嵌视频，请使用<a href="./nanchang15-promo.mp4">直接打开 MP4</a>观看。
      </video>

      <div class="actions">
        <button id="play-button" type="button">▶ 点击播放</button>
        <a class="file-link" href="./nanchang15-promo.mp4">打开 / 下载 MP4</a>
      </div>
      <p class="note">如果当前网络限制了内嵌播放器，仍可点击“打开 / 下载 MP4”使用系统播放器观看；视频文件与本页面都公开托管在 GitHub Pages。</p>
    </section>

    <footer>
      <span>真实页面状态、校园实景与隐私安全演示</span>
      <span><a href="https://xxc2007.me">打开线上纪念册</a> · <a href="https://github.com/xxc2007/In-memory-of-Nanchang-No.-15-Middle-School">查看开源仓库</a></span>
    </footer>
  </main>

  <script>
    const video = document.getElementById('promo-video');
    const playButton = document.getElementById('play-button');

    playButton.addEventListener('click', async () => {
      if (video.paused) {
        try {
          await video.play();
        } catch {
          video.focus();
        }
      } else {
        video.pause();
      }
    });

    const syncButton = () => {
      playButton.textContent = video.paused ? '▶ 点击播放' : 'Ⅱ 暂停播放';
    };
    video.addEventListener('play', syncButton);
    video.addEventListener('pause', syncButton);
    video.addEventListener('ended', syncButton);
  </script>
</body>
</html>
