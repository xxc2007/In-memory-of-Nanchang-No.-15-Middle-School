<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1530" viewBox="0 0 1200 1530" role="img" aria-labelledby="title description" xml:lang="en"><title id="title">Campus memorial · Content, maps and guestbook</title><desc id="description">The diagram separates static reading, the map tour and the guestbook: photographs and text use static assets; the map loads on demand and follows the viewpoint data; messages use a separate service for storage and moderation. Green marks reader-visible results; amber marks moderation, failure handling or constraints.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 L 2 3.5 Z" fill="#4e585f"/></marker></defs><rect width="1200" height="1530" fill="#ffffff"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><path data-edge="entry-html" d="M 600 258 V 282.5 H 600 V 307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="html-shared" d="M 600 393 V 417.5 H 600 V 442" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="shared-photos" d="M 600 528 V 575 H 220 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="shared-tour" d="M 600 528 V 575 H 600 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="shared-wall" d="M 600 528 V 575 H 980 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="photos-lightbox" d="M 220 708 V 747.5 H 220 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="lightbox-photoresult" d="M 220 873 V 912.5 H 220 V 952" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="tour-spots" d="M 600 708 V 747.5 H 600 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="spots-mapok" d="M 600 873 V 908 H 600 V 943" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="mapok-mapresult" d="M 600 1047 V 1087 H 600 V 1127" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="mapok-mapfallback" d="M 600 1047 V 1087 H 220 V 1127" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="wall-artalk" d="M 980 708 V 747.5 H 980 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="artalk-action" d="M 980 873 V 908 H 980 V 943" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="action-moderate" d="M 980 1047 V 1087 H 980 V 1127" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="action-readwall" d="M 815 995 H 790 V 1260 H 600 V 1307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="moderate-readwall" d="M 980 1213 V 1260 H 600 V 1307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="artalk-wallfail" d="M 1145 830 H 1182 V 1350 H 1145" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="600" cy="146" r="7" fill="#252a2e"/><path d="M 600 153 V 172" stroke="#4e585f" stroke-width="1.7" marker-end="url(#arrow)"/><g data-node="entry" data-kind="process" data-cx="600" data-cy="215" data-half-height="43"><rect x="435" y="172" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="entry" x="600" y="220.44" text-anchor="middle" font-size="17" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Visit /nc15/ or a language path</tspan></text></g><g data-node="html" data-kind="process" data-cx="600" data-cy="350" data-half-height="43"><rect x="435" y="307" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="html" x="600" y="340.74" text-anchor="middle" font-size="13.25" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Serve the matching static HTML</tspan><tspan x="600" dy="27">Each edition has its own content and SEO</tspan></text></g><g data-node="shared" data-kind="process" data-cx="600" data-cy="485" data-half-height="43"><rect x="435" y="442" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="shared" x="600" y="476.54" text-anchor="middle" font-size="15.75" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Share CSS and vanilla JavaScript</tspan><tspan x="600" dy="27">Use html lang for dynamic messages</tspan></text></g><g data-node="photos" data-kind="process" data-cx="220" data-cy="665" data-half-height="43"><rect x="55" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="photos" x="220" y="655.98" text-anchor="middle" font-size="14" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Browse photos, history and water tower</tspan><tspan x="220" dy="27">Thumbnails / full photos + main.js</tspan></text></g><g data-node="tour" data-kind="process" data-cx="600" data-cy="665" data-half-height="43"><rect x="435" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="tour" x="600" y="656.62" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Scroll near the campus tour</tspan><tspan x="600" dy="27">Load tour photos and MapLibre map</tspan></text></g><g data-node="wall" data-kind="process" data-cx="980" data-cy="665" data-half-height="43"><rect x="815" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="wall" x="980" y="656.78" text-anchor="middle" font-size="16.5" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Scroll near the guestbook</tspan><tspan x="980" dy="27">wall.js requests /comment/api/v2</tspan></text></g><g data-node="lightbox" data-kind="process" data-cx="220" data-cy="830" data-half-height="43"><rect x="55" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="lightbox" x="220" y="820.82" text-anchor="middle" font-size="13.5" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Lightbox zoom, drag and keyboard use</tspan><tspan x="220" dy="27">Scroll motion respects user preferences</tspan></text></g><g data-node="spots" data-kind="process" data-cx="600" data-cy="830" data-half-height="43"><rect x="435" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="spots" x="600" y="820.42" text-anchor="middle" font-size="12.25" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">SPOTS in map.js is the shared index</tspan><tspan x="600" dy="27">Eight views link photos, locations and text</tspan></text></g><g data-node="artalk" data-kind="process" data-cx="980" data-cy="830" data-half-height="43"><rect x="815" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="artalk" x="980" y="820.82" text-anchor="middle" font-size="13.5" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">nginx proxies requests to Artalk</tspan><tspan x="980" dy="27">SQLite stores messages and review state</tspan></text></g><g data-node="photoresult" data-kind="result" data-cx="220" data-cy="995" data-half-height="43"><rect x="55" y="952" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text data-node-label="photoresult" x="220" y="986.54" text-anchor="middle" font-size="15.75" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Readable in a local static preview</tspan><tspan x="220" dy="27">Photographs, text and timeline</tspan></text></g><g data-node="mapok" data-kind="decision" data-cx="600" data-cy="995" data-half-height="52"><path d="M 600 943 L 765 995 L 600 1047 L 435 995 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text data-node-label="mapok" x="600" y="1000.44" text-anchor="middle" font-size="17" font-weight="500" fill="#252a2e"><tspan x="600" dy="0">Map resources available?</tspan></text></g><g data-node="action" data-kind="decision" data-cx="980" data-cy="995" data-half-height="52"><path d="M 980 943 L 1145 995 L 980 1047 L 815 995 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text data-node-label="action" x="980" y="1000.44" text-anchor="middle" font-size="17" font-weight="500" fill="#252a2e"><tspan x="980" dy="0">Read or submit?</tspan></text></g><g data-node="mapfallback" data-kind="guard" data-cx="220" data-cy="1170" data-half-height="43"><rect x="55" y="1127" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text data-node-label="mapfallback" x="220" y="1161.22" text-anchor="middle" font-size="14.75" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Retry a failed map load</tspan><tspan x="220" dy="27">Static content and photo tour remain</tspan></text></g><g data-node="mapresult" data-kind="result" data-cx="600" data-cy="1170" data-half-height="43"><rect x="435" y="1127" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text data-node-label="mapresult" x="600" y="1161.06" text-anchor="middle" font-size="14.25" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Basemaps / imagery / building layers</tspan><tspan x="600" dy="27">Markers track the selected photograph</tspan></text></g><g data-node="moderate" data-kind="guard" data-cx="980" data-cy="1170" data-half-height="43"><rect x="815" y="1127" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text data-node-label="moderate" x="980" y="1161.78" text-anchor="middle" font-size="16.5" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">New messages await moderation</tspan><tspan x="980" dy="27">Visible after webmaster approval</tspan></text></g><g data-node="readwall" data-kind="result" data-cx="600" data-cy="1350" data-half-height="43"><rect x="435" y="1307" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text data-node-label="readwall" x="600" y="1340.98" text-anchor="middle" font-size="14" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Show published messages</tspan><tspan x="600" dy="27">All editions share /guestbook page_key</tspan></text></g><g data-node="wallfail" data-kind="guard" data-cx="980" data-cy="1350" data-half-height="43"><rect x="815" y="1307" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text data-node-label="wallfail" x="980" y="1340.82" text-anchor="middle" font-size="13.5" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Show errors / retry on API failure</tspan><tspan x="980" dy="27">Explain limits in local static previews</tspan></text></g><text data-edge-label="shared-photos" x="220" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Read</tspan></text><text data-edge-label="shared-tour" x="618" y="563" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="618" dy="0">Map and tour</tspan></text><text data-edge-label="shared-wall" x="980" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Guestbook</tspan></text><text data-edge-label="mapok-mapresult" x="618" y="1075" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="618" dy="0">Yes</tspan></text><text data-edge-label="mapok-mapfallback" x="410" y="1075" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">No</tspan></text><text data-edge-label="action-moderate" x="998" y="1075" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="998" dy="0">Submit</tspan></text><text data-edge-label="action-readwall" x="774" y="1065" text-anchor="end" font-size="16" font-weight="400" fill="#252a2e"><tspan x="774" dy="0">Read</tspan></text><text data-edge-label="moderate-readwall" x="768" y="1248" text-anchor="end" font-size="16" font-weight="400" fill="#252a2e"><tspan x="768" dy="0">Approved</tspan></text><text data-edge-label="artalk-wallfail" x="1166" y="1080" text-anchor="end" font-size="16" font-weight="400" fill="#252a2e"><tspan x="1166" dy="0">API unavailable</tspan></text><text  x="600" y="45" text-anchor="middle" font-size="30" font-weight="600" fill="#252a2e"><tspan x="600" dy="0">Campus memorial · Content, maps and guestbook</tspan></text><text  x="600" y="82" text-anchor="middle" font-size="18" font-weight="400" fill="#59646c"><tspan x="600" dy="0">Ten static language pages share photographs, interaction code and one guestbook.</tspan></text><rect x="177" y="103" width="26" height="21" rx="3" fill="#f4f5f6" stroke="#899198"/><text  x="213" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="213" dy="0">Process</tspan></text><path d="M 435 102 l 13 11 l -13 11 l -13 -11 Z" fill="white" stroke="#899198"/><text  x="458" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="458" dy="0">Decision</tspan></text><rect x="667" y="103" width="26" height="21" rx="3" fill="#edf6ee" stroke="#267349"/><text  x="703" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="703" dy="0">Visible result</tspan></text><rect x="912" y="103" width="26" height="21" rx="3" fill="#fff5e9" stroke="#aa681f"/><text  x="948" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="948" dy="0">Guard / fallback</tspan></text><text  x="600" y="1463" text-anchor="middle" font-size="16" font-weight="400" fill="#626c74"><tspan x="600" dy="0">Map tiles and guestbook service require network access. Building heights are estimates, not a surveyed campus model.</tspan></text><text  x="600" y="1495" text-anchor="middle" font-size="15" font-weight="400" fill="#78838b"><tspan x="600" dy="0">Documentation illustration · 22 October 2026 · SVG, editable text and paths</tspan></text></g></svg>
