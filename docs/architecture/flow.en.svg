<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1530" viewBox="0 0 1200 1530" role="img" aria-labelledby="title description" xml:lang="en"><title id="title">Campus memorial · Content, maps and guestbook</title><desc id="description">The diagram separates static reading, the map tour and the guestbook: photographs and text use static assets; the map loads on demand and follows the viewpoint data; messages use a separate service for storage and moderation. Green marks reader-visible results; amber marks moderation, failure handling or constraints.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 L 2 3.5 Z" fill="#4e585f"/></marker></defs><rect width="1200" height="1530" fill="#ffffff"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><path d="M 600 258 V 282.5 H 600 V 307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 393 V 417.5 H 600 V 442" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 528 V 575 H 220 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="220" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Read</tspan></text><path d="M 600 528 V 575 H 600 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Map and tour</tspan></text><path d="M 600 528 V 575 H 980 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="980" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Guestbook</tspan></text><path d="M 220 708 V 747.5 H 220 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 220 873 V 912.5 H 220 V 952" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 708 V 747.5 H 600 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 873 V 908 H 600 V 943" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1047 V 1087 H 600 V 1127" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="614" y="1075" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="614" dy="0">Yes</tspan></text><path d="M 600 1047 V 1087 H 220 V 1127" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="1075" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">No</tspan></text><path d="M 980 708 V 747.5 H 980 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 980 873 V 908 H 980 V 943" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 980 1047 V 1087 H 980 V 1127" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="994" y="1075" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="994" dy="0">Submit</tspan></text><path d="M 815 995 H 790 V 1260 H 600 V 1307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="780" y="1065" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="780" dy="0">Read</tspan></text><path d="M 980 1213 V 1260 H 600 V 1307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="790" y="1248" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="790" dy="0">Approved</tspan></text><path d="M 1145 830 H 1182 V 1350 H 1145" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1173" y="1080" text-anchor="end" font-size="16" font-weight="400" fill="#252a2e"><tspan x="1173" dy="0">API unavailable</tspan></text><circle cx="600" cy="146" r="7" fill="#252a2e"/><path d="M 600 153 V 172" stroke="#4e585f" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="435" y="172" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="222" text-anchor="middle" font-size="17" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Visit /nc15/ or a language path</tspan></text><rect x="435" y="307" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="343.5" text-anchor="middle" font-size="13.39" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Serve the matching static HTML</tspan><tspan x="600" dy="27">Each edition has its own content and SEO</tspan></text><rect x="435" y="442" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="478.5" text-anchor="middle" font-size="15.76" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Share CSS and vanilla JavaScript</tspan><tspan x="600" dy="27">Use html lang for dynamic messages</tspan></text><rect x="55" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="220" y="658.5" text-anchor="middle" font-size="14.1" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Browse photos, history and water tower</tspan><tspan x="220" dy="27">Thumbnails / full photos + main.js</tspan></text><rect x="435" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="658.5" text-anchor="middle" font-size="16.23" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Scroll near the campus tour</tspan><tspan x="600" dy="27">Load tour photos and MapLibre map</tspan></text><rect x="815" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="980" y="658.5" text-anchor="middle" font-size="16.74" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Scroll near the guestbook</tspan><tspan x="980" dy="27">wall.js requests /comment/api/v2</tspan></text><rect x="55" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="220" y="823.5" text-anchor="middle" font-size="13.74" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Lightbox zoom, drag and keyboard use</tspan><tspan x="220" dy="27">Scroll motion respects user preferences</tspan></text><rect x="435" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="823.5" text-anchor="middle" font-size="12.46" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">SPOTS in map.js is the shared index</tspan><tspan x="600" dy="27">Eight views link photos, locations and text</tspan></text><rect x="815" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="980" y="823.5" text-anchor="middle" font-size="13.74" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">nginx proxies requests to Artalk</tspan><tspan x="980" dy="27">SQLite stores messages and review state</tspan></text><rect x="55" y="952" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="220" y="988.5" text-anchor="middle" font-size="15.76" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Readable in a local static preview</tspan><tspan x="220" dy="27">Photographs, text and timeline</tspan></text><path d="M 600 943 L 765 995 L 600 1047 L 435 995 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text x="600" y="1002" text-anchor="middle" font-size="17" font-weight="500" fill="#252a2e"><tspan x="600" dy="0">Map resources available?</tspan></text><path d="M 980 943 L 1145 995 L 980 1047 L 815 995 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text x="980" y="1002" text-anchor="middle" font-size="17" font-weight="500" fill="#252a2e"><tspan x="980" dy="0">Read or submit?</tspan></text><rect x="55" y="1127" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="220" y="1163.5" text-anchor="middle" font-size="14.88" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Retry a failed map load</tspan><tspan x="220" dy="27">Static content and photo tour remain</tspan></text><rect x="435" y="1127" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="600" y="1163.5" text-anchor="middle" font-size="14.48" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Basemaps / imagery / building layers</tspan><tspan x="600" dy="27">Markers track the selected photograph</tspan></text><rect x="815" y="1127" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="980" y="1163.5" text-anchor="middle" font-size="16.74" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">New messages await moderation</tspan><tspan x="980" dy="27">Visible after webmaster approval</tspan></text><rect x="435" y="1307" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="600" y="1343.5" text-anchor="middle" font-size="14.1" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Show published messages</tspan><tspan x="600" dy="27">All editions share /guestbook page_key</tspan></text><rect x="815" y="1307" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="980" y="1343.5" text-anchor="middle" font-size="13.74" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Show errors / retry on API failure</tspan><tspan x="980" dy="27">Explain limits in local static previews</tspan></text><text x="600" y="45" text-anchor="middle" font-size="30" font-weight="600" fill="#252a2e"><tspan x="600" dy="0">Campus memorial · Content, maps and guestbook</tspan></text><text x="600" y="82" text-anchor="middle" font-size="18" font-weight="400" fill="#59646c"><tspan x="600" dy="0">Ten static language pages share photographs, interaction code and one guestbook.</tspan></text><rect x="177" y="103" width="26" height="21" rx="3" fill="#f4f5f6" stroke="#899198"/><text x="213" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="213" dy="0">Process</tspan></text><path d="M 435 102 l 13 11 l -13 11 l -13 -11 Z" fill="white" stroke="#899198"/><text x="458" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="458" dy="0">Decision</tspan></text><rect x="667" y="103" width="26" height="21" rx="3" fill="#edf6ee" stroke="#267349"/><text x="703" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="703" dy="0">Visible result</tspan></text><rect x="912" y="103" width="26" height="21" rx="3" fill="#fff5e9" stroke="#aa681f"/><text x="948" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="948" dy="0">Guard / fallback</tspan></text><text x="600" y="1463" text-anchor="middle" font-size="16" font-weight="400" fill="#626c74"><tspan x="600" dy="0">Map tiles and guestbook service require network access. Building heights are estimates, not a surveyed campus model.</tspan></text><text x="600" y="1495" text-anchor="middle" font-size="15" font-weight="400" fill="#78838b"><tspan x="600" dy="0">Documentation illustration · 22 October 2026 · SVG, editable text and paths</tspan></text></g></svg>
