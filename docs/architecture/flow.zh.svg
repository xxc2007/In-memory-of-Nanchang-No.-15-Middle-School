<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1448" viewBox="0 0 1200 1448" role="img" aria-labelledby="title description" xml:lang="zh"><title id="title">校园纪念册 · 内容、地图与留言如何协作</title><desc id="description">这张图把静态阅读、地图漫游和留言服务分成三条路径：照片与正文由静态资源提供；地图按需加载并与机位数据联动；留言通过独立服务存储和审核。绿色表示读者可见结果，橙色表示审核、失败处理或约束。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 L 2 3.5 Z" fill="#4e585f"/></marker></defs><rect width="1200" height="1448" fill="#ffffff"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><path data-edge="entry-html" d="M 600 258 V 282.5 H 600 V 307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="html-shared" d="M 600 393 V 417.5 H 600 V 442" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="shared-photos" d="M 600 528 V 575 H 220 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="shared-tour" d="M 600 528 V 575 H 600 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="shared-wall" d="M 600 528 V 575 H 980 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="photos-lightbox" d="M 220 708 V 747.5 H 220 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="lightbox-photoresult" d="M 220 873 V 912.5 H 220 V 952" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="tour-spots" d="M 600 708 V 747.5 H 600 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="spots-mapok" d="M 600 873 V 908 H 600 V 943" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="mapok-mapresult" d="M 600 1047 V 1087 H 600 V 1127" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="mapok-mapfallback" d="M 600 1047 V 1087 H 220 V 1127" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="wall-artalk" d="M 980 708 V 747.5 H 980 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="artalk-action" d="M 980 873 V 908 H 980 V 943" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="action-moderate" d="M 980 1047 V 1087 H 980 V 1127" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="action-readwall" d="M 815 995 H 790 V 1260 H 600 V 1307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="moderate-readwall" d="M 980 1213 V 1260 H 600 V 1307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="artalk-wallfail" d="M 1145 830 H 1182 V 1350 H 1145" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="600" cy="146" r="7" fill="#252a2e"/><path d="M 600 153 V 172" stroke="#4e585f" stroke-width="1.7" marker-end="url(#arrow)"/><g data-node="entry" data-kind="process" data-cx="600" data-cy="215" data-half-height="43"><rect x="435" y="172" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="entry" x="600" y="221.4" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">访问 /nc15/ 或对应语言路径</tspan></text></g><g data-node="html" data-kind="process" data-cx="600" data-cy="350" data-half-height="43"><rect x="435" y="307" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="html" x="600" y="342.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">服务对应语言的静态 HTML</tspan><tspan x="600" dy="27">各页有独立内容与 SEO 元数据</tspan></text></g><g data-node="shared" data-kind="process" data-cx="600" data-cy="485" data-half-height="43"><rect x="435" y="442" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="shared" x="600" y="477.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">共享 CSS 与原生 JavaScript</tspan><tspan x="600" dy="27">按 html lang 选择动态文案</tspan></text></g><g data-node="photos" data-kind="process" data-cx="220" data-cy="665" data-half-height="43"><rect x="55" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="photos" x="220" y="657.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">浏览照片、时间轴与水塔</tspan><tspan x="220" dy="27">缩略图 / 全幅照片 + main.js</tspan></text></g><g data-node="tour" data-kind="process" data-cx="600" data-cy="665" data-half-height="43"><rect x="435" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="tour" x="600" y="657.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">滚动接近校园寻踪</tspan><tspan x="600" dy="27">加载漫游照片与 MapLibre 地图</tspan></text></g><g data-node="wall" data-kind="process" data-cx="980" data-cy="665" data-half-height="43"><rect x="815" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="wall" x="980" y="657.66" text-anchor="middle" font-size="19.25" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">滚动接近留言墙</tspan><tspan x="980" dy="27">wall.js 请求 /comment/api/v2</tspan></text></g><g data-node="lightbox" data-kind="process" data-cx="220" data-cy="830" data-half-height="43"><rect x="55" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="lightbox" x="220" y="822.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">灯箱缩放、拖拽与键盘操作</tspan><tspan x="220" dy="27">滚动动画遵循减少动态效果设置</tspan></text></g><g data-node="spots" data-kind="process" data-cx="600" data-cy="830" data-half-height="43"><rect x="435" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="spots" x="600" y="822.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">map.js 的 SPOTS 为共同索引</tspan><tspan x="600" dy="27">八个机位连接照片、坐标与文案</tspan></text></g><g data-node="artalk" data-kind="process" data-cx="980" data-cy="830" data-half-height="43"><rect x="815" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="artalk" x="980" y="822.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">nginx 反向代理到 Artalk</tspan><tspan x="980" dy="27">SQLite 保存留言与审核状态</tspan></text></g><g data-node="photoresult" data-kind="result" data-cx="220" data-cy="995" data-half-height="43"><rect x="55" y="952" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text data-node-label="photoresult" x="220" y="987.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">在本地静态预览中也能浏览</tspan><tspan x="220" dy="27">照片、正文和时间轴</tspan></text></g><g data-node="mapok" data-kind="decision" data-cx="600" data-cy="995" data-half-height="52"><path d="M 600 943 L 765 995 L 600 1047 L 435 995 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text data-node-label="mapok" x="600" y="1001.4" text-anchor="middle" font-size="20" font-weight="500" fill="#252a2e"><tspan x="600" dy="0">地图资源可用？</tspan></text></g><g data-node="action" data-kind="decision" data-cx="980" data-cy="995" data-half-height="52"><path d="M 980 943 L 1145 995 L 980 1047 L 815 995 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text data-node-label="action" x="980" y="1001.4" text-anchor="middle" font-size="20" font-weight="500" fill="#252a2e"><tspan x="980" dy="0">读取还是提交？</tspan></text></g><g data-node="mapfallback" data-kind="guard" data-cx="220" data-cy="1170" data-half-height="43"><rect x="55" y="1127" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text data-node-label="mapfallback" x="220" y="1162.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">地图失败可重试</tspan><tspan x="220" dy="27">静态内容与照片漫游仍可访问</tspan></text></g><g data-node="mapresult" data-kind="result" data-cx="600" data-cy="1170" data-half-height="43"><rect x="435" y="1127" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text data-node-label="mapresult" x="600" y="1162.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">底图 / 影像 / 建筑图层</tspan><tspan x="600" dy="27">机位标记与当前照片联动</tspan></text></g><g data-node="moderate" data-kind="guard" data-cx="980" data-cy="1170" data-half-height="43"><rect x="815" y="1127" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text data-node-label="moderate" x="980" y="1162.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">新留言进入待审核状态</tspan><tspan x="980" dy="27">站长审核通过后才公开显示</tspan></text></g><g data-node="readwall" data-kind="result" data-cx="600" data-cy="1350" data-half-height="43"><rect x="435" y="1307" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text data-node-label="readwall" x="600" y="1342.02" text-anchor="middle" font-size="17.25" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">只显示已公开留言</tspan><tspan x="600" dy="27">十种语言共用 /guestbook page_key</tspan></text></g><g data-node="wallfail" data-kind="guard" data-cx="980" data-cy="1350" data-half-height="43"><rect x="815" y="1307" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text data-node-label="wallfail" x="980" y="1342.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">接口失败显示错误 / 重试</tspan><tspan x="980" dy="27">本地静态预览说明服务限制</tspan></text></g><text data-edge-label="shared-photos" x="220" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">阅读</tspan></text><text data-edge-label="shared-tour" x="618" y="563" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="618" dy="0">地图与漫游</tspan></text><text data-edge-label="shared-wall" x="980" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">留言</tspan></text><text data-edge-label="mapok-mapresult" x="618" y="1075" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="618" dy="0">是</tspan></text><text data-edge-label="mapok-mapfallback" x="410" y="1075" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">否</tspan></text><text data-edge-label="action-moderate" x="998" y="1075" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="998" dy="0">提交</tspan></text><text data-edge-label="action-readwall" x="774" y="1065" text-anchor="end" font-size="16" font-weight="400" fill="#252a2e"><tspan x="774" dy="0">读取</tspan></text><text data-edge-label="moderate-readwall" x="768" y="1248" text-anchor="end" font-size="16" font-weight="400" fill="#252a2e"><tspan x="768" dy="0">审核通过</tspan></text><text data-edge-label="artalk-wallfail" x="1166" y="1080" text-anchor="end" font-size="16" font-weight="400" fill="#252a2e"><tspan x="1166" dy="0">接口不可用</tspan></text><text  x="600" y="45" text-anchor="middle" font-size="30" font-weight="600" fill="#252a2e"><tspan x="600" dy="0">校园纪念册 · 内容、地图与留言如何协作</tspan></text><text  x="600" y="82" text-anchor="middle" font-size="18" font-weight="400" fill="#59646c"><tspan x="600" dy="0">十个静态语言页面，共享照片、交互代码与同一面留言墙。</tspan></text><rect x="177" y="103" width="26" height="21" rx="3" fill="#f4f5f6" stroke="#899198"/><text  x="213" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="213" dy="0">处理步骤</tspan></text><path d="M 435 102 l 13 11 l -13 11 l -13 -11 Z" fill="white" stroke="#899198"/><text  x="458" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="458" dy="0">条件判断</tspan></text><rect x="667" y="103" width="26" height="21" rx="3" fill="#edf6ee" stroke="#267349"/><text  x="703" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="703" dy="0">可见结果</tspan></text><rect x="912" y="103" width="26" height="21" rx="3" fill="#fff5e9" stroke="#aa681f"/><text  x="948" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="948" dy="0">约束 / 后备路径</tspan></text></g></svg>
