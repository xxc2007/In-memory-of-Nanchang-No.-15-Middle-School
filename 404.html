/* =========================================================
   404 · 这一页还空着
   自包含单文件：全部样式内联、零外部依赖（任何路径/协议/缓存状态都可完整渲染）

   视觉母题：「空」——地平线上的一枚时间线节点（2022.8.31 空旷操场）
   ========================================================= */
:root{
  --cream:#F0EEE6; --paper:#FAF9F5; --ink:#1F1E1D; --muted:#6E6A5E;
  --terra:#D97757; --terra-deep:#C15F3C; --line:#E4DFD3;
  --serif:'Noto Serif SC Variable','Noto Serif SC',Georgia,'Times New Roman','Songti SC','STSong','SimSun',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--cream);color:var(--ink);
  font-size:16px;line-height:1.9;-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
::selection{background:var(--terra);color:#fff}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px;border-radius:2px}

/* ---- 顶栏（与主站同构的迷你版） ---- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:18px 28px;border-bottom:1px solid var(--line);
}
.topbar img{width:28px;height:28px;border-radius:50%;box-shadow:0 2px 8px rgba(31,30,29,.15)}
.topbar b{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--ink);letter-spacing:.04em}
.topbar span{font-size:12.5px;color:var(--muted);margin-left:2px}

/* ---- 主体：天空区 ---- */
.sky{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 24px 0}
.nf{max-width:620px;text-align:center}
.eyebrow{
  display:inline-flex;align-items:center;gap:12px;
  font-size:12px;letter-spacing:.3em;color:var(--muted);
}
.eyebrow b{color:var(--terra);font-weight:700}
.eyebrow::before,.eyebrow::after{content:"";width:36px;height:1px;background:var(--line)}
.nf h1{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(38px,7vw,64px);line-height:1.25;letter-spacing:.01em;
  color:var(--ink);margin:20px 0 18px;
}
.nf .copy{color:var(--muted);font-size:15.5px;line-height:2.1;max-width:28em;margin:0 auto 38px}
.nf .copy em{font-style:normal;color:var(--ink)}
.nf a.home{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;
  background:var(--terra-deep);color:#FAF9F5;border-radius:8px;
  padding:12px 34px;font-size:14.5px;font-weight:600;letter-spacing:.06em;
  transition:background .25s, transform .25s;
}
.nf a.home:hover{background:var(--terra);transform:translateY(-1px)}
.nf a.home svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- 地平线：母题——线上停一枚时间线节点 ---- */
.horizon{position:relative;height:1px;background:var(--line);margin:64px auto 0;max-width:820px}
.horizon .node{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:11px;height:11px;border-radius:50%;
  background:var(--cream);border:2px solid var(--terra);
}

/* ---- 地面：坐标 + 章节导航 + 域名签名 ---- */
.ground{max-width:820px;margin:0 auto;padding:20px 24px 40px;
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;
  font-size:12.5px;color:var(--muted)}
.ground .coord{font-variant-numeric:tabular-nums;letter-spacing:.06em}
.ground nav a{color:var(--muted);text-decoration:none;padding:0 7px;transition:color .2s}
.ground nav a:hover{color:var(--terra)}
.ground .sig{letter-spacing:.08em}
@media (max-width:640px){
  .topbar{padding:14px 18px}
  .sky{padding:44px 18px 0}
  .ground{flex-direction:column;align-items:center;text-align:center;gap:8px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
